<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema SET — Ambiente de Homologação</title>
    <link rel="shortcut icon" href="../icone.ico" type="image/x-icon">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #020813 0%, #001f54 50%, #001133 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            color: #ffffff;
        }

        .card-container {
            background: linear-gradient(145deg, #0e1726 0%, #162238 100%);
            border: 1px solid rgba(0, 210, 255, 0.3);
            border-radius: 20px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6), 0 0 30px rgba(0, 210, 255, 0.15);
            max-width: 540px;
            width: 100%;
            padding: 36px;
            text-align: left;
        }

        .badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(0, 210, 255, 0.1);
            color: #00d2ff;
            border: 1px solid rgba(0, 210, 255, 0.3);
            padding: 6px 14px;
            border-radius: 50px;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 0.5px;
            margin-bottom: 20px;
            text-transform: uppercase;
        }

        .pulse-dot {
            width: 8px;
            height: 8px;
            background-color: #64748b;
            border-radius: 50%;
            box-shadow: 0 0 10px #64748b;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(0.95); opacity: 0.8; }
            50% { transform: scale(1.1); opacity: 1; }
            100% { transform: scale(0.95); opacity: 0.8; }
        }

        h1 {
            font-size: 24px;
            font-weight: 800;
            color: #ffffff;
            margin-bottom: 8px;
            letter-spacing: -0.5px;
        }

        p.subtitle {
            color: #94a3b8;
            font-size: 14px;
            margin-bottom: 28px;
            line-height: 1.5;
        }

        .status-box {
            background: #060b13;
            border: 1px solid #1e293b;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 24px;
        }

        .status-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            font-size: 13px;
            font-weight: 700;
            color: #cbd5e1;
        }

        pre {
            background: #020813;
            border: 1px solid #1e293b;
            border-radius: 8px;
            padding: 14px;
            color: #38bdf8;
            font-family: 'Consolas', 'Courier New', monospace;
            font-size: 13px;
            overflow-x: auto;
            white-space: pre-wrap;
            word-break: break-all;
        }

        .btn-check {
            width: 100%;
            background: linear-gradient(135deg, #00d2ff 0%, #0045ff 100%);
            color: #ffffff;
            border: none;
            border-radius: 12px;
            padding: 14px;
            font-size: 14px;
            font-weight: 800;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 6px 20px rgba(0, 69, 255, 0.4);
        }

        .btn-check:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(0, 210, 255, 0.5);
        }

        .btn-check:disabled {
            opacity: 0.6;
            cursor: wait;
        }
    </style>
</head>
<body>

    <div class="card-container">
        <div class="badge">
            <span class="pulse-dot" id="dot-status"></span>
            <span id="badge-text">Ambiente Web Homologação</span>
        </div>

        <h1>Sistema SET — Ambiente de Homologação</h1>
        <p class="subtitle">Estrutura inicial da fundação Web. Teste de conectividade com o Backend Node.js / Express e PostgreSQL.</p>

        <div class="status-box">
            <div class="status-header">
                <span>Endpoint: /api/health</span>
                <span id="http-code" style="color:#94a3b8;">Aguardando...</span>
            </div>
            <pre id="json-output">Carregando status do servidor...</pre>
        </div>

        <button class="btn-check" id="btn-refresh">
            🔄 Testar Conexão Novamente
        </button>
    </div>

    <script src="/app.js" defer></script>
</body>
</html>
