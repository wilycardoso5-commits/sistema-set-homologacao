<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema SET — Ambiente de Homologação</title>
    <link rel="shortcut icon" href="../icone.ico" type="image/x-icon">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #020813 0%, #001f54 50%, #001133 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            color: #ffffff;
        }

        .card-container {
            background: linear-gradient(145deg, #0e1726 0%, #162238 100%);
            border: 1px solid rgba(0, 210, 255, 0.3);
            border-radius: 20px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6), 0 0 30px rgba(0, 210, 255, 0.15);
            max-width: 540px;
            width: 100%;
            padding: 36px;
            text-align: left;
        }

        .badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(0, 210, 255, 0.1);
            color: #00d2ff;
            border: 1px solid rgba(0, 210, 255, 0.3);
            padding: 6px 14px;
            border-radius: 50px;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 0.5px;
            margin-bottom: 20px;
            text-transform: uppercase;
        }

        .pulse-dot {
            width: 8px;
            height: 8px;
            background-color: #64748b;
            border-radius: 50%;
            box-shadow: 0 0 10px #64748b;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(0.95); opacity: 0.8; }
            50% { transform: scale(1.1); opacity: 1; }
            100% { transform: scale(0.95); opacity: 0.8; }
        }

        h1 {
            font-size: 24px;
            font-weight: 800;
            color: #ffffff;
            margin-bottom: 8px;
            letter-spacing: -0.5px;
        }

        p.subtitle {
            color: #94a3b8;
            font-size: 14px;
            margin-bottom: 28px;
            line-height: 1.5;
        }

        .status-box {
            background: #060b13;
            border: 1px solid #1e293b;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 24px;
        }

        .status-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            font-size: 13px;
            font-weight: 700;
            color: #cbd5e1;
        }

        pre {
            background: #020813;
            border: 1px solid #1e293b;
            border-radius: 8px;
            padding: 14px;
            color: #38bdf8;
            font-family: 'Consolas', 'Courier New', monospace;
            font-size: 13px;
            overflow-x: auto;
            white-space: pre-wrap;
            word-break: break-all;
        }

        .btn-check {
            width: 100%;
            background: linear-gradient(135deg, #00d2ff 0%, #0045ff 100%);
            color: #ffffff;
            border: none;
            border-radius: 12px;
            padding: 14px;
            font-size: 14px;
            font-weight: 800;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 6px 20px rgba(0, 69, 255, 0.4);
        }

        .btn-check:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(0, 210, 255, 0.5);
        }

        .btn-check:disabled {
            opacity: 0.6;
            cursor: wait;
        }
    </style>
</head>
<body>

    <div class="card-container">
        <div class="badge">
            <span class="pulse-dot" id="dot-status"></span>
            <span id="badge-text">Ambiente Web Homologação</span>
        </div>

        <h1>Sistema SET — Ambiente de Homologação</h1>
        <p class="subtitle">Estrutura inicial da fundação Web. Teste de conectividade com o Backend Node.js / Express e PostgreSQL.</p>

        <div class="status-box">
            <div class="status-header">
                <span>Endpoint: /api/health</span>
                <span id="http-code" style="color:#94a3b8;">Aguardando...</span>
            </div>
            <pre id="json-output">Carregando status do servidor...</pre>
        </div>

        <button class="btn-check" onclick="consultarHealth()" id="btn-refresh">
            🔄 Testar Conexão Novamente
        </button>
    </div>

    <script>
        async function consultarHealth() {
            const output = document.getElementById('json-output');
            const codeEl = document.getElementById('http-code');
            const btn = document.getElementById('btn-refresh');
            const dot = document.getElementById('dot-status');
            const badgeText = document.getElementById('badge-text');
            
            btn.disabled = true;
            output.innerText = "Consultando /api/health...";
            
            try {
                const response = await fetch('/api/health');
                const data = await response.json();
                
                // Substitui o texto "Carregando status do servidor..." pelos dados retornados pela API
                output.innerText = JSON.stringify(data, null, 2);
                codeEl.innerText = `HTTP ${response.status} OK`;

                // Indicador muda para VERDE quando status === "ok" e database === "conectado"
                if (data.status === 'ok' && data.database === 'conectado') {
                    dot.style.backgroundColor = '#10b981';
                    dot.style.boxShadow = '0 0 10px #10b981';
                    codeEl.style.color = '#10b981';
                    badgeText.innerText = 'Sistema Online & Banco Conectado';
                } else if (data.database === 'desconectado' || data.status === 'degradado') {
                    dot.style.backgroundColor = '#f59e0b';
                    dot.style.boxShadow = '0 0 10px #f59e0b';
                    codeEl.style.color = '#f59e0b';
                    badgeText.innerText = 'Sistema Degradado (Banco Desconectado)';
                } else {
                    dot.style.backgroundColor = '#ef4444';
                    dot.style.boxShadow = '0 0 10px #ef4444';
                    codeEl.style.color = '#ef4444';
                    badgeText.innerText = 'Status Indefinido';
                }
            } catch (err) {
                codeEl.innerText = 'Falha na Conexão';
                codeEl.style.color = '#ef4444';
                dot.style.backgroundColor = '#ef4444';
                dot.style.boxShadow = '0 0 10px #ef4444';
                badgeText.innerText = 'Servidor Indisponível';
                
                output.innerText = JSON.stringify({
                    status: "erro",
                    mensagem: "Não foi possível conectar ao servidor em /api/health",
                    detalhes: err.message
                }, null, 2);
            } finally {
                btn.disabled = false;
            }
        }

        // Executa ao carregar a página
        window.addEventListener('DOMContentLoaded', consultarHealth);
    </script>
</body>
</html>
